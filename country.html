<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country | Country Guide</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="country.css" />
    <script src="travel-apis.js" defer></script>
    <script src="country.js" defer></script>
</head>
<body>
    <header class="header-container">
        <div class="header-content">
            <h2 class="title">
                <a href="index.html" class="site-logo">
                    <span class="logo-primary">Country</span>
                    <span class="logo-accent">Guide</span>
                </a>
            </h2>
            <p class="theme-changer"><i class="fa-regular fa-moon"></i>&nbsp;&nbsp;<span class="theme-text">Dark Mode</span></p>
        </div>
    </header>

    <main>
        <div class="country-details-container">
            <span class="back-button" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>&nbsp; Back
            </span>

            <div class="loading-state" id="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Building your AI travel guide…</p>
                <p style="font-size:0.85rem;margin-top:8px;opacity:0.7">Crafting attractions, food picks, local tips & more</p>
            </div>

            <div class="country-page" id="country-page" hidden>
                <section class="country-hero">
                    <img id="country-flag" src="" alt="Country flag" />
                    <div class="hero-text">
                        <h1 id="country-name">Country</h1>
                        <p class="hero-meta" id="hero-meta"></p>
                        <p class="hero-extract" id="hero-extract"></p>
                        <div class="hero-badges" id="hero-badges"></div>
                    </div>
                </section>

                <nav class="guide-tabs" role="tablist" aria-label="Travel guide sections">
                    <button class="guide-tab active" role="tab" aria-selected="true" aria-controls="panel-overview" data-tab="overview">
                        <i class="fa-solid fa-compass"></i> Overview
                    </button>
                    <button class="guide-tab" role="tab" aria-selected="false" aria-controls="panel-attractions" data-tab="attractions">
                        <i class="fa-solid fa-landmark"></i> Attractions
                    </button>
                    <button class="guide-tab" role="tab" aria-selected="false" aria-controls="panel-transport" data-tab="transport">
                        <i class="fa-solid fa-train"></i> Transport
                    </button>
                    <button class="guide-tab" role="tab" aria-selected="false" aria-controls="panel-food" data-tab="food">
                        <i class="fa-solid fa-utensils"></i> Food
                    </button>
                    <button class="guide-tab" role="tab" aria-selected="false" aria-controls="panel-tips" data-tab="tips">
                        <i class="fa-solid fa-lightbulb"></i> Tips
                    </button>
                </nav>

                <div class="guide-panels">
                    <section class="guide-panel active" id="panel-overview" role="tabpanel">
                        <div class="panel-grid" id="overview-content"></div>
                    </section>
                    <section class="guide-panel" id="panel-attractions" role="tabpanel" hidden>
                        <div id="attractions-content"></div>
                    </section>
                    <section class="guide-panel" id="panel-transport" role="tabpanel" hidden>
                        <div id="transport-content"></div>
                    </section>
                    <section class="guide-panel" id="panel-food" role="tabpanel" hidden>
                        <div id="food-content"></div>
                    </section>
                    <section class="guide-panel" id="panel-tips" role="tabpanel" hidden>
                        <div id="tips-content" class="accordion-group"></div>
                    </section>
                </div>
            </div>

            <div class="error-state" id="error-state" hidden>
                <i class="fa-solid fa-circle-exclamation"></i>
                <h2>Country not found</h2>
                <p>We couldn't load this destination. Try searching from the home page.</p>
                <a href="index.html" class="back-button">Browse countries</a>
            </div>
        </div>
    </main>
</body>
</html>
